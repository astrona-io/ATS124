        path: sections/section-020/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair A Broken Tekton Installation Capstone"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: installation
        task_kind: troubleshooting
        tags: [webhook, pipelines-controller, dashboard, read-only-dashboard, rbac, release-manifest]
        learning_goals:
          - Find why the API server refuses Tekton objects and why runs do not start
          - Bring back the webhook and the controller, and switch the Dashboard to read-only without leftover permissions
