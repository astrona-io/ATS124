      - type: lab
        title: "Finish A Tekton Installation Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: installation
        task_kind: build
        tags: [release-manifest, dashboard, read-only-dashboard, config-defaults, serviceaccount, webhook]
        learning_goals:
          - Install the read-only Tekton Dashboard from its release manifest
          - Set the default timeout and ServiceAccount in config-defaults
          - Prove the installation with a TaskRun that picks up the new defaults
        resources:
          - name: "Install Tekton Pipelines"
