apiVersion: v1
kind: ServiceAccount
metadata:
  name: trigger-sa
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trigger-sa-roles
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: trigger-sa
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trigger-sa-clusterroles
subjects:
  - kind: ServiceAccount
    name: trigger-sa
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
