# Diagnose A Failing TaskRun
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-124-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-124-lab-010-01-setup"
      description: "Applies the Task preflight and the TaskRun preflight-run, and waits until the TaskRun has failed"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-preflight-run"
      description: "Confirms preflight-run uses the Task preflight with target=bridge, ran collect then verify, and succeeded"
      type: "file"
      source: "validation/validate-preflight-run.sh"
    - name: "validate-preflight-result"
      description: "Confirms preflight-run reports summary 'bridge: 3 checks passed'"
      type: "file"
      source: "validation/validate-preflight-result.sh"
    - name: "validate-task-shares-files"
      description: "Runs the Task with four checks and confirms verify counts what collect wrote"
      type: "file"
      source: "validation/validate-task-shares-files.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
