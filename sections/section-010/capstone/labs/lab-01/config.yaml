# Repair A Multi-Step Task (section 010 capstone)
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-124-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-124-capstone-010-setup"
      description: "Applies the Task inspect to the wrong namespace with two steps swapped, and a TaskRun that needs a missing ServiceAccount"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-task-inspect"
      description: "Confirms the Task inspect is in starfleet with the steps scan, summarize, report"
      type: "file"
      source: "validation/validate-task-inspect.sh"
    - name: "validate-serviceaccount"
      description: "Confirms the ServiceAccount inspector exists and the pod of inspect-run ran as it"
      type: "file"
      source: "validation/validate-serviceaccount.sh"
    - name: "validate-inspect-run"
      description: "Confirms inspect-run succeeded with one container per step and the expected result"
      type: "file"
      source: "validation/validate-inspect-run.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
