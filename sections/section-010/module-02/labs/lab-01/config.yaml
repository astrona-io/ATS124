# Repair A Two-Task Pipeline
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-124-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-124-lab-010-02-setup"
      description: "Applies the Tasks, the Pipeline roster and the PipelineRun roster-run, and waits until the run has failed"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-roster-run"
      description: "Confirms roster-run uses the Pipeline roster with the right crew, ran write and read, and succeeded"
      type: "file"
      source: "validation/validate-roster-run.sh"
    - name: "validate-roster-result"
      description: "Confirms roster-run reports 'roster has 3 names, first: bridge'"
      type: "file"
      source: "validation/validate-roster-result.sh"
    - name: "validate-pipeline-works"
      description: "Runs the Pipeline with two names and its own volumeClaimTemplate and checks the report"
      type: "file"
      source: "validation/validate-pipeline-works.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
