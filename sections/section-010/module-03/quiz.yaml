# Knowledge check for module 010-03. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats124-010-03
course_id: ATS124
exam_code: TEKTON
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Follow The Tekton Controllers"
placement:
  position: after
  reading: sections/section-010/module-03/course-05-summary.md
questions:
  - id: ats124-010-03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Place the webhook"
    source_readings:
      - sections/section-010/module-03/course-01-the-reconcile-loop-and-the-webhook.md
    prompt: "When does the Tekton webhook act on an object?"
    options:
      - id: a
        text: "When the object is created or changed, before it is stored."
        explanation: "Correct. The API server calls the webhook for each create or update of a Tekton object."
      - id: b
        text: "After the pod has started."
        explanation: "Not correct. That is the controller, after storage."
      - id: c
        text: "Only when a step fails."
        explanation: "Not correct. The webhook does not watch runs."
      - id: d
        text: "Every minute, on all objects."
        explanation: "Not correct. It acts on API requests, not on a timer."
    correct_option: a
    explanation: "Correct. The API server calls the webhook for each create or update of a Tekton object."

  - id: ats124-010-03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a webhook outage"
    source_readings:
      - sections/section-010/module-03/course-01-the-reconcile-loop-and-the-webhook.md
    prompt: "The webhook Deployment is down. What does kubectl apply of a new TaskRun do?"
    options:
      - id: a
        text: "It is stored, with no defaults."
        explanation: "Not correct. The webhook configuration blocks creation when it cannot be called."
      - id: b
        text: "The API server refuses it, because the webhook cannot be reached."
        explanation: "Correct. The failure policy of the webhook configuration blocks creation while the webhook is down."
      - id: c
        text: "It is stored and the controller adds the defaults."
        explanation: "Not correct. Defaulting happens in the webhook only."
      - id: d
        text: "It is queued until the webhook is back."
        explanation: "Not correct. The API server answers with an error at once."
    correct_option: b
    explanation: "Correct. The failure policy of the webhook configuration blocks creation while the webhook is down."

  - id: ats124-010-03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the reconcile loop"
    source_readings:
      - sections/section-010/module-03/course-01-the-reconcile-loop-and-the-webhook.md
    prompt: "Why can the controller recover after a restart?"
    options:
      - id: a
        text: "It keeps a private database of runs."
        explanation: "Not correct. All state is in Kubernetes objects."
      - id: b
        text: "It replays a log of earlier events."
        explanation: "Not correct. It does not depend on past events."
      - id: c
        text: "Each pass compares the object with the pod and the status, so it can continue from the stored state."
        explanation: "Correct. Runs created while the controller was down are started when it returns."
      - id: d
        text: "It restarts every run from the first step."
        explanation: "Not correct. It continues from the stored state."
    correct_option: c
    explanation: "Correct. Runs created while the controller was down are started when it returns."

  - id: ats124-010-03-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Separate controller and step permissions"
    source_readings:
      - sections/section-010/module-03/course-02-serviceaccounts-rbac-and-the-pod-template.md
    prompt: "Which ServiceAccount do the steps of a TaskRun use?"
    options:
      - id: a
        text: "The ServiceAccount of the controller."
        explanation: "Not correct. The controller uses its own, with wider rights."
      - id: b
        text: "The ServiceAccount of the webhook."
        explanation: "Not correct. The webhook is unrelated to the steps."
      - id: c
        text: "cluster-admin."
        explanation: "Not correct. No such account is used unless you grant it."
      - id: d
        text: "The one in spec.serviceAccountName, or the default of the namespace."
        explanation: "Correct. The permissions of the controller say nothing about what the steps may do."
    correct_option: d
    explanation: "Correct. The permissions of the controller say nothing about what the steps may do."

  - id: ats124-010-03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check a permission"
    source_readings:
      - sections/section-010/module-03/course-02-serviceaccounts-rbac-and-the-pod-template.md
    prompt: "Which command tests what a ServiceAccount may do?"
    options:
      - id: a
        text: "kubectl auth can-i --as=system:serviceaccount:NAMESPACE:NAME"
        explanation: "Correct. The --as flag asks the API server as that account."
      - id: b
        text: "kubectl get serviceaccount --can-i"
        explanation: "Not correct. This flag does not exist."
      - id: c
        text: "tkn serviceaccount check"
        explanation: "Not correct. tkn has no such command."
      - id: d
        text: "kubectl describe taskrun --permissions"
        explanation: "Not correct. This flag does not exist."
    correct_option: a
    explanation: "Correct. The --as flag asks the API server as that account."

  - id: ats124-010-03-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Use a pod template"
    source_readings:
      - sections/section-010/module-03/course-02-serviceaccounts-rbac-and-the-pod-template.md
    prompt: "What does spec.podTemplate of a TaskRun change?"
    options:
      - id: a
        text: "The image of each step."
        explanation: "Not correct. Images are set in the step."
      - id: b
        text: "Settings of the pod of that run, such as securityContext."
        explanation: "Correct. config-defaults can set a default pod template for all new runs."
      - id: c
        text: "The Task definition for all runs."
        explanation: "Not correct. It affects one run."
      - id: d
        text: "The timeout of the run."
        explanation: "Not correct. Timeouts have their own field."
    correct_option: b
    explanation: "Correct. config-defaults can set a default pod template for all new runs."

  - id: ats124-010-03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the signals of a run"
    source_readings:
      - sections/section-010/module-03/course-03-events-conditions-and-metrics.md
    prompt: "Which list names the four signals that a run leaves?"
    options:
      - id: a
        text: "Only the condition and the pod log."
        explanation: "Not correct. Events and metrics are signals too."
      - id: b
        text: "Only events."
        explanation: "Not correct. Events expire after about an hour."
      - id: c
        text: "The condition, events, controller metrics and the controller log."
        explanation: "Correct. The condition stays with the run; events are kept for about an hour."
      - id: d
        text: "The webhook log and the DNS log."
        explanation: "Not correct. They are not Tekton signals."
    correct_option: c
    explanation: "Correct. The condition stays with the run; events are kept for about an hour."

  - id: ats124-010-03-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the metrics port"
    source_readings:
      - sections/section-010/module-03/course-03-events-conditions-and-metrics.md
    prompt: "On which port does the Tekton controller expose metrics?"
    options:
      - id: a
        text: "443"
        explanation: "Not correct. That is a TLS port, not the metrics port."
      - id: b
        text: "8080"
        explanation: "Not correct. This is not the Tekton metrics port."
      - id: c
        text: "10250"
        explanation: "Not correct. This is the kubelet port."
      - id: d
        text: "9090"
        explanation: "Correct. The controller metrics are served on port 9090."
    correct_option: d
    explanation: "Correct. The controller metrics are served on port 9090."

  - id: ats124-010-03-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell failures apart"
    source_readings:
      - sections/section-010/module-03/course-04-where-to-look-first.md
    prompt: "A TaskRun refers to a Task that does not exist. What is the result?"
    options:
      - id: a
        text: "The object is stored and the run fails with the reason TaskRunResolutionFailed."
        explanation: "Correct. A missing parameter, by contrast, gives TaskRunValidationFailed."
      - id: b
        text: "The webhook refuses the TaskRun."
        explanation: "Not correct. The webhook does not check that the Task exists."
      - id: c
        text: "The run waits forever."
        explanation: "Not correct. It fails with a reason."
      - id: d
        text: "The pod starts and the step fails."
        explanation: "Not correct. No pod exists for a missing Task."
    correct_option: a
    explanation: "Correct. A missing parameter, by contrast, gives TaskRunValidationFailed."

  - id: ats124-010-03-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Triage in order"
    source_readings:
      - sections/section-010/module-03/course-04-where-to-look-first.md
    prompt: "What do you read first on a failed run?"
    options:
      - id: a
        text: "The controller log."
        explanation: "Not correct. This is the last place to look."
      - id: b
        text: "The reason and message of the Succeeded condition."
        explanation: "Correct. After the condition, check whether a pod existed, then the step status and log, then events and the controller log."
      - id: c
        text: "The metrics."
        explanation: "Not correct. Metrics show trends, not one run."
      - id: d
        text: "The Deployment of the webhook."
        explanation: "Not correct. Check it only if creation was refused."
    correct_option: b
    explanation: "Correct. After the condition, check whether a pod existed, then the step status and log, then events and the controller log."
