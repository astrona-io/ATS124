# Triage Four Failed Runs
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-124-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-124-lab-010-03-setup"
      description: "Applies the Tasks and four failing TaskRuns, and waits until all four have ended"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-triage-map"
      description: "Confirms the ConfigMap triage holds the reason of each of the four failed TaskRuns"
      type: "file"
      source: "validation/validate-triage-map.sh"
    - name: "validate-originals-kept"
      description: "Confirms the four failed TaskRuns and their Tasks are unchanged"
      type: "file"
      source: "validation/validate-originals-kept.sh"
    - name: "validate-fixed-run"
      description: "Confirms the TaskRun r-fixed uses echo-name and succeeded with the result 'hello warp'"
      type: "file"
      source: "validation/validate-fixed-run.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
