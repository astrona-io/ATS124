# Set Defaults For The Installation
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-124-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-124-lab-020-02-setup"
      description: "Applies the Task whoami and runs the TaskRun before, which reports uid 0"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-defaults-config"
      description: "Confirms config-defaults holds the managed-by value and a pod template for user and group 1000, and keeps its other keys"
      type: "file"
      source: "validation/validate-defaults-config.sh"
    - name: "validate-after-run"
      description: "Confirms the TaskRun after succeeded as user 1000 with the new label, and before still reports 0"
      type: "file"
      source: "validation/validate-after-run.sh"
    - name: "validate-new-run-gets-defaults"
      description: "Creates a run of whoami with no pod template and checks it reports 1000 with the new label"
      type: "file"
      source: "validation/validate-new-run-gets-defaults.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
