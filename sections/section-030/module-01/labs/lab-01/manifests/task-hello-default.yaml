# A decoy: a Task with the same name in the namespace default. tkn starts this
# one when the learner forgets -n starfleet.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: hello
  namespace: default
spec:
  description: An old copy of hello. Do not use it.
  params:
    - name: crew
      type: string
      description: The crew member to greet
  results:
    - name: greeting
      description: The greeting that was printed
  steps:
    - name: greet
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        set -eu
        printf 'Wrong namespace, %s.' "$(params.crew)" | tee "$(results.greeting.path)"
