# Operate Pipelines With tkn
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-124-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-124-lab-030-02-setup"
      description: "Applies the Pipelines deliver and wait-forever, starts the run stuck, and creates five succeeded runs of deliver"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-ship-run"
      description: "Confirms a ship-* run of deliver succeeded with the summary orbit:v1"
      type: "file"
      source: "validation/validate-ship-run.sh"
    - name: "validate-stuck-cancelled"
      description: "Confirms the run stuck still exists and is cancelled"
      type: "file"
      source: "validation/validate-stuck-cancelled.sh"
    - name: "validate-keep-three"
      description: "Confirms only the ship run, deliver-old-4 and deliver-old-5 remain as runs of deliver"
      type: "file"
      source: "validation/validate-keep-three.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
