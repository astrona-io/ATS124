# Triage And Rerun Work With tkn (section 030 capstone)
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-124-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-124-capstone-030-setup"
      description: "Applies the Task deploy-check and four old TaskRuns of it, two of which fail"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The tkn and kubectl commands a correct learner runs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-triage"
      description: "Confirms the ConfigMap triage records failed-step=validate and pipelines-version=v1.17.1"
      type: "file"
      source: "validation/validate-triage.sh"
    - name: "validate-cleanup"
      description: "Confirms only the failed runs were deleted"
      type: "file"
      source: "validation/validate-cleanup.sh"
    - name: "validate-new-run"
      description: "Confirms a new deploy-check-run-... ran with crew=shuttle and deck=3 and reports the expected greeting"
      type: "file"
      source: "validation/validate-new-run.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
